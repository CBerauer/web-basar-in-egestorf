        <aside class="sidebar">

                </a>

                    <img src="../assets/images/autogen/Galerie_Noffline_1.png" 
                         onmouseover="this.src='../assets/images/autogen/Galerie_NRonline_1.png'"
                         onmouseout="this.src='../assets/images/autogen/Galerie_Noffline_1.png'"
                         alt="Galerie" title="Galerie">

                <a href="../html/team.html" class="nav-item">
                    <img src="../assets/images/autogen/Team_Noffline_1.png"

                         alt="Team" title="Team">

                <a href="../html/kontakt.html" class="nav-item active">
                    <img src="../assets/images/autogen/Kontakt_Honline_1.png" 
                         onmouseover="this.src='../assets/images/autogen/Kontakt_HRonline_1.png'"
                         onmouseout="this.src='../assets/images/autogen/Kontakt_Honline_1.png'"
                         alt="Kontakt" title="Kontakt">
                </a>
                <a href="../html/anfahrt.html" class="nav-item">
                    <img src="../assets/images/autogen/Anfahrt_Noffline_1.png" 
                         onmouseover="this.src='../assets/images/autogen/Anfahrt_NRonline_1.png'"

        </aside>

        <main class="main-content">
            <header class="header-image">
                <img src="../assets/images/autogen/WaescheLeine.png" alt="Basar-in-Egestorf" title="Basar-in-Egestorf">
            </header>

            <div class="content registration-page">
                <iframe id="registration-frame" src="" width="760" height="1000" frameborder="0" marginheight="0" marginwidth="0">Wird geladen...</iframe>
                
                <nav class="text-nav">
                    <a href="../index.html">Home</a>
                    <a href="../html/infos.html">Infos</a>

                    <a href="../html/termine.html">Termine</a>
                </nav>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const current = basarConfig.getCurrent();
            const iframe = document.getElementById('registration-frame');
            
            if (current.registrationURL) {
                iframe.src = current.registrationURL;
            } else {
                iframe.style.display = 'none';
                const message = document.createElement('p');
                message.className = 'info';
                message.style.textAlign = 'center';
                message.style.fontSize = '20px';
                message.textContent = 'Die Anmeldung ist derzeit nicht verfügbar.';
                iframe.parentNode.insertBefore(message, iframe);
            }
        });
    </script>
